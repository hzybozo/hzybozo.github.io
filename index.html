<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Name — Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO -->
    <main class="hero">
        <div class="hero-content">
            <p class="eyebrow">PORTFOLIO</p>

            <h1>Your Name</h1>

            <p class="hero-description">
                I design and build modern digital experiences,
                interfaces and websites.
            </p>
        </div>
    </main>


    <!-- IMAGE STRIP -->
    <section class="gallery-section">

        <div class="gallery-header">
            <div>
                <p class="eyebrow">SELECTED WORK</p>
                <h2>My Projects</h2>
            </div>

            <span class="drag-hint">
                Drag to explore →
            </span>
        </div>

        <div class="gallery-wrapper">

            <div class="gallery" id="gallery">

                <div class="gallery-item colour-1">
                    <div class="image-number">01</div>
                </div>

                <div class="gallery-item colour-2">
                    <div class="image-number">02</div>
                </div>

                <div class="gallery-item colour-3">
                    <div class="image-number">03</div>
                </div>

                <div class="gallery-item colour-4">
                    <div class="image-number">04</div>
                </div>

                <div class="gallery-item colour-5">
                    <div class="image-number">05</div>
                </div>

                <div class="gallery-item colour-6">
                    <div class="image-number">06</div>
                </div>

                <div class="gallery-item colour-7">
                    <div class="image-number">07</div>
                </div>

                <div class="gallery-item colour-8">
                    <div class="image-number">08</div>
                </div>

                <div class="gallery-item colour-9">
                    <div class="image-number">09</div>
                </div>

                <div class="gallery-item colour-10">
                    <div class="image-number">10</div>
                </div>

                <div class="gallery-item colour-11">
                    <div class="image-number">11</div>
                </div>

                <div class="gallery-item colour-12">
                    <div class="image-number">12</div>
                </div>

            </div>

        </div>

    </section>


    <!-- FULLSCREEN IMAGE VIEWER -->
    <div class="lightbox" id="lightbox">

        <button class="lightbox-close" id="lightboxClose">
            ×
        </button>

        <div class="lightbox-content" id="lightboxContent">
            <div class="lightbox-image" id="lightboxImage">
                <span id="lightboxNumber"></span>
            </div>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
