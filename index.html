<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hzy — Roblox Designer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO -->
    <main class="hero">

        <div class="hero-content">

            <p class="eyebrow">
                ROBLOX DESIGNER
            </p>

            <h1>
                Hzy
            </h1>

            <p class="hero-description">
                I design immersive and interactive experiences
                for Roblox.
            </p>

            <div class="hero-discord">
                <span>Discord</span>

                <strong>
                    hzybozo
                </strong>
            </div>

        </div>

    </main>


    <!-- PROJECTS -->
    <section class="gallery-section">

        <div class="gallery-header">

            <p class="eyebrow">
                SELECTED WORK
            </p>

            <h2>
                My Projects
            </h2>

        </div>


        <!--
            This container intentionally does NOT scroll.

            The JavaScript moves the gallery track
            itself, which means the mouse wheel remains
            completely free for normal website scrolling.
        -->

        <div
            class="gallery-wrapper"
            id="galleryWrapper"
        >

            <div
                class="gallery"
                id="gallery"
            >

                <div class="gallery-item colour-1">
                    <div class="image-number">01</div>
                </div>

                <div class="gallery-item colour-2">
                    <div class="image-number">02</div>
                </div>

                <div class="gallery-item colour-3">
                    <div class="image-number">03</div>
                </div>

                <div class="gallery-item colour-4">
                    <div class="image-number">04</div>
                </div>

                <div class="gallery-item colour-5">
                    <div class="image-number">05</div>
                </div>

                <div class="gallery-item colour-6">
                    <div class="image-number">06</div>
                </div>

                <div class="gallery-item colour-7">
                    <div class="image-number">07</div>
                </div>

                <div class="gallery-item colour-8">
                    <div class="image-number">08</div>
                </div>

                <div class="gallery-item colour-9">
                    <div class="image-number">09</div>
                </div>

                <div class="gallery-item colour-10">
                    <div class="image-number">10</div>
                </div>

                <div class="gallery-item colour-11">
                    <div class="image-number">11</div>
                </div>

                <div class="gallery-item colour-12">
                    <div class="image-number">12</div>
                </div>

            </div>

        </div>

    </section>


    <!-- LIGHTBOX -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <button
            class="lightbox-close"
            id="lightboxClose"
            aria-label="Close"
        >
            ×
        </button>


        <div
            class="lightbox-content"
            id="lightboxContent"
        >

            <div
                class="lightbox-image"
                id="lightboxImage"
            >

                <span
                    id="lightboxNumber"
                ></span>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
